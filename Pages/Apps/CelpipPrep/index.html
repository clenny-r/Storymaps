<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rowe CELPIP Mock Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout traced from the official sample test: the page never scrolls. One bordered test window fills the screen:
   a thin grey title strip (title left, time remaining + NEXT right), then two equal panels that each scroll on their own.
   Left panel (grey) = instructions and media or passage. Right panel (pale blue-green) = questions and answers.
   Deliberately single (light) theme, like the test software. */
:root{
  color-scheme: light;
  --page:#e7e9ec; --win:#ffffff; --ink:#2f3337; --text:#53565a; --line:#cccccc;
  --bar-1:#eeeef3; --bar-2:#d7dbe0; --gray:#f5f5f5; --bluebg:#eef8f9;
  --instr:#1a578a; --key:#4789ac; --box:#d9dce1; --hover:#ddffb7; --sel:#c6e8ea; --prog:#00ccff;
  --btn:#337ab7; --btn-d:#2e6da4; --dd:#003399; --dd-sel:#005338;
  --ok:#2d7a4c; --ok-soft:#e5f3ea; --bad:#b2271d; --bad-soft:#fbe9e7; --warn:#9a5a00; --warn-soft:#fdf2df;
  --font:'Fira Sans','Trebuchet MS','Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:16px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.window{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1180px;margin:0 auto;background:var(--win);border:1px solid var(--line)}
.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;padding:6px 20px;background:linear-gradient(var(--bar-1),var(--bar-2));border-bottom:1px solid var(--line);text-shadow:1px 1px 0 #fff}
.bar-title{font-weight:700;color:#333;font-size:16px;min-width:0;text-wrap:balance}
.bar-right{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.timer{font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink);white-space:nowrap}
.timer b{color:#000}
.timer.low b{color:var(--bad)}
.btn{border:1px solid #b9c0c8;background:#fff;border-radius:4px;padding:5px 14px;cursor:pointer;font-weight:600;text-shadow:none}
.btn:hover{background:#f3f5f7}
.btn:disabled{opacity:.5;cursor:default}
.btn-blue,.next{background:var(--btn);border:1px solid var(--btn-d);color:#fff;border-radius:4px;padding:5px 22px;font-weight:600;letter-spacing:.03em;cursor:pointer;text-shadow:1px 1px 0 #000}
.btn-blue:hover,.next:hover{background:#286090}
.next:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
#stage{flex:1 1 auto;min-height:0;display:flex;overflow:hidden}
#stage>.pane,#stage>.split{flex:1 1 auto;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100%;min-height:0}
.pane{height:100%;min-height:0;overflow-y:auto}
.pane-in{padding:20px 22px 30px}
.pane.gray{background:var(--gray)}
.pane.blue{background:var(--bluebg);border-left:1px solid var(--line)}
.pane.white{background:#fff}
.narrow{max-width:900px;margin:0 auto}
.foot{flex:0 0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--text);max-width:1180px;width:100%;margin:0 auto;padding-block:6px 8px}
.foot .saved{color:var(--ok)}
.foot .unsaved{color:var(--warn)}
@media (max-width:860px){
  #stage{display:block;overflow:auto}
  .split{display:block;height:auto}
  .pane{height:auto;overflow:visible}
  .pane.blue{border-left:0;border-top:1px solid var(--line)}
}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0 0 .5em;color:var(--ink)}
h1{font-size:26px} h2{font-size:21px} h3{font-size:18px}
p{margin:0 0 .8em}
.muted{color:#6b7177}
.small{font-size:14px}
.label{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:#6b7177;font-weight:700}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:4px;background:var(--gray);padding:16px 18px;min-width:0}

/* Test-software pieces */
.instruction{position:relative;font-size:17px;font-weight:700;color:var(--instr);line-height:1.25;margin:0 0 16px;padding-left:24px}
.instruction::before{content:"";position:absolute;left:3px;top:3px;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--key)}
.key{color:var(--key)}
.sbox{display:flex;align-items:center;gap:15px;background:var(--box);border-radius:10px;max-width:375px;margin:14px auto;padding:18px 20px;color:#000;font-size:1.1em}
.ico{flex:0 0 65px;height:65px;background:#eee;border-radius:5px;display:grid;place-items:center}
.ico svg{width:34px;height:34px}
.sbox .txt{flex:1 1 auto;min-width:0;text-align:center}
.pbar18{height:18px;background:#eee;margin-top:10px;overflow:hidden}
.pbar18 i{display:block;height:100%;width:0;background:var(--prog);transition:width .25s linear}
ul.intro{list-style:none;margin:6px 0 16px;padding:0;font-size:17px;font-weight:700;color:var(--instr)}
ul.intro li{position:relative;padding:8px 10px 10px 34px;border-bottom:1px dotted #ccc;line-height:1.5}
ul.intro li:last-child{border-bottom:0}
ul.intro li::before{content:"\2022";position:absolute;left:8px;top:2px;color:#999;font:italic 700 25px Georgia,serif}

/* Listening */
.video{width:min(100%,820px,calc(58vh * 2.222));margin:0 auto;border:1px solid #333;background:#000}
.video canvas{display:block;width:100%;height:auto;aspect-ratio:800/360}
.thumb{width:min(100%,420px);margin:6px auto 0;border:1px solid #bbb}
.thumb canvas{display:block;width:100%;height:auto;aspect-ratio:800/360}
.caption{width:min(100%,820px);margin:10px auto 0;min-height:44px;padding:8px 12px;background:#1d2733;color:#fff;font-size:16px}
.audio-status{width:min(100%,820px);margin:4px auto 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.qhead{font-weight:700;color:var(--ink);margin-bottom:14px}
.qtext{font-size:18px;font-weight:600;color:var(--ink);margin:0 0 12px}
.opts{list-style:none;margin:0;padding:0;border-top:1px dotted #ccc}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px 8px 6px;border-bottom:1px dotted #ccc;cursor:pointer;color:#222}
.opt input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:2px solid #7d8a96;border-radius:50%;margin:4px 0 0;flex:0 0 auto;background:#fff;cursor:pointer}
.opt input:checked{border-color:var(--instr);background:radial-gradient(circle,var(--instr) 0 3.5px,#fff 4.5px)}
.opt:hover{background:var(--hover)}
.opt.sel{background:var(--sel);text-decoration:underline}

/* Reading */
.passage{font-size:16px;color:#222}
.passage h3{color:var(--ink)}
.qlist{display:grid;gap:18px}
.qrow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;align-items:start;color:#222}
.qrow .n{font-weight:700;color:var(--ink);padding-top:2px}
select.dd{max-width:100%;padding:2px 6px;border:1px solid #c9d6de;border-bottom:1px dotted #888;border-radius:0;background:#fff;color:var(--dd);margin-top:4px;cursor:pointer}
select.dd:hover{background:#ccfaff;border-color:#256360}
select.dd.filled{font-weight:700;color:var(--dd-sel);background:#fff}
.blank b{color:var(--ink);margin-right:3px}
.blank select.dd{margin-top:0}
.reply{margin-top:20px;padding-top:14px;border-top:1px dotted #bbb}
.tbl-wrap{overflow-x:auto}
table.diagram{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums;background:#fff}
table.diagram th,table.diagram td{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}
table.diagram th{background:#e3e8ed}
ul.notes{font-size:14.5px;padding-left:20px}

/* Writing */
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.toolbar .btn{padding:3px 12px;font-size:14px}
textarea.editor{width:100%;min-height:48vh;resize:vertical;padding:12px;border:1px solid #9fb0c2;background:#fff;color:#222;font:16px/1.55 var(--font)}
.wcount{display:flex;justify-content:space-between;font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
.choice{display:flex;gap:10px;align-items:flex-start;border-bottom:1px dotted #ccc;padding:8px 6px;cursor:pointer;color:#222}
.choice:hover{background:var(--hover)}
.choice.sel{background:var(--sel)}

/* Speaking */
.pic{margin-top:12px;border:1px solid #bbb;background:#fff}
.pic svg,.pic img{display:block;width:100%;height:auto}
.prep{display:flex;gap:16px;align-items:center;background:var(--box);border-radius:10px;max-width:350px;margin:30px auto 0;padding:20px}
.prep .ico{flex-basis:75px;height:82px;background:#fff;border-radius:10px}
.prep .txt{flex:1 1 auto;min-width:0;text-align:center;color:#000}
.prep .pname{font-weight:700}
.prep .count{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin:4px 0}
.prep.rec .pname,.prep.rec .count{color:var(--bad)}
.prep.rec .pbar18 i{background:var(--bad)}
.meter{height:6px;margin-top:8px;background:#eee;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.pbar18 i{transition:none}}
.cards{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start;margin-top:12px}
.cards .or{align-self:center;font-weight:700;color:var(--instr)}
.card{border:2px solid #bbb;background:#fff;padding:8px;cursor:pointer;text-align:left;color:#222;min-width:0}
.card svg,.card img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
.card h4{margin:8px 0 4px;font-size:16px}
.card ul{margin:0;padding-left:18px;font-size:14px}
.card.sel{border-color:var(--btn);background:#d7ecff}
.card.locked{cursor:default}

/* Start + results */
.start{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
@media (max-width:860px){.start{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:4px;margin-bottom:14px;color:#222}
.field input[type=text],.field select{padding:7px 10px;border:1px solid #9fb0c2;border-radius:3px;background:#fff}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.status{padding:8px 12px;border-radius:3px;font-size:14.5px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0 18px}
.score{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--gray);color:#222}
.score .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.review{width:100%;border-collapse:collapse;font-size:14.5px;color:#222}
.review th,.review td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.review td.ok{color:var(--ok);font-weight:700} .review td.bad{color:var(--bad);font-weight:700}
details{border:1px solid var(--line);border-radius:3px;padding:8px 12px;margin:10px 0;background:#fff}
details summary{cursor:pointer;font-weight:600;color:var(--ink)}
.transcript p{margin:0 0 .4em;font-size:15px}
.files{font-family:Consolas,'Courier New',monospace;font-size:13px;background:var(--gray);border:1px solid var(--line);padding:8px 10px;border-radius:3px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:rgba(20,28,38,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:#fff;border-radius:6px;max-width:480px;width:100%;padding:20px 22px;border:1px solid var(--line);color:#222}
.pause{position:fixed;inset:0;background:rgba(231,233,236,.97);display:flex;align-items:center;justify-content:center;z-index:40;flex-direction:column;gap:14px}
</style>
</head>
<body>
<div id="app">
  <div class="window">
    <header class="bar">
      <div class="bar-title" id="barTitle">CELPIP-style Mock Exam</div>
      <div class="bar-right">
        <button class="btn" id="pauseBtn" hidden>Pause</button>
        <div class="timer" id="timer" hidden></div>
        <button class="next" id="nextBtn" hidden>NEXT</button>
      </div>
    </header>
    <main id="stage"></main>
  </div>
  <footer class="foot"><span id="footWho">Unofficial practice exam. Original questions in the CELPIP-General format.</span><span id="footSave"></span></footer>
</div>
<div class="modal" id="modal" hidden><div class="box"><div id="modalBody"></div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="modalNo">Go back</button><button class="btn-blue" id="modalYes">Continue</button></div></div></div>
<div class="pause" id="pauseLayer" hidden><h2>Paused</h2><p class="muted">The timer is stopped. Practice mode only.</p><button class="btn-blue" id="resumeBtn">Resume</button></div>

<!-- Test content files. Add more tests by dropping mock_test_B.js (and so on) into the tests folder. -->
<script src="tests/mock_test_A.js"></script>
<script src="tests/mock_test_B.js" onerror="this.remove()"></script>
<script src="tests/mock_test_C.js" onerror="this.remove()"></script>
<script src="tests/mock_test_D.js" onerror="this.remove()"></script>
<script src="tests/mock_test_E.js" onerror="this.remove()"></script>
<script src="tests/mock_test_F.js" onerror="this.remove()"></script>
<script src="tests/mock_test_G.js" onerror="this.remove()"></script>
<script src="tests/mock_test_H.js" onerror="this.remove()"></script>
<script src="tests/mock_test_I.js" onerror="this.remove()"></script>
<script src="tests/mock_test_J.js" onerror="this.remove()"></script>
<script src="tests/mock_test_K.js" onerror="this.remove()"></script>
<script src="tests/mock_test_L.js" onerror="this.remove()"></script>
<script src="tests/mock_test_M.js" onerror="this.remove()"></script>
<script src="tests/mock_test_N.js" onerror="this.remove()"></script>
<script src="tests/mock_test_O.js" onerror="this.remove()"></script>
<script src="tests/mock_test_P.js" onerror="this.remove()"></script>
<script src="tests/mock_test_Q.js" onerror="this.remove()"></script>
<script src="tests/mock_test_R.js" onerror="this.remove()"></script>
<script src="tests/mock_test_S.js" onerror="this.remove()"></script>
<script src="tests/mock_test_T.js" onerror="this.remove()"></script>
<script src="tests/mock_test_U.js" onerror="this.remove()"></script>
<script>
'use strict';
/* ============================== utilities ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
/* Safe lookup for timers and audio callbacks that may fire after the screen has changed. */
const $s = s => document.querySelector(s) || { style: {}, classList: { add() { }, remove() { }, toggle() { } }, dataset: {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const stampOf = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
const clockOf = (d = new Date()) => `${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
const niceTime = (d = new Date()) => d.toLocaleString('en-CA', { dateStyle: 'medium', timeStyle: 'medium' });
const safeName = n => (n || '').trim().replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'Candidate';
const wc = t => { const m = String(t || '').trim().match(/\S+/g); return m ? m.length : 0; };
const fmtLong = sec => { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), s = sec % 60; return (m ? `${m} minute${m !== 1 ? 's' : ''} ` : '') + `${s} second${s !== 1 ? 's' : ''}`; };
const fmtShort = sec => { sec = Math.max(0, Math.ceil(sec)); return `${Math.floor(sec / 60)}:${pad(sec % 60)}`; };
const stripHtml = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+\n/g, '\n').trim(); };
function sleep(ms, token) { return new Promise(r => { const t0 = Date.now(); const iv = setInterval(() => { if ((token && token.cancelled) || Date.now() - t0 >= ms) { clearInterval(iv); r(); } }, 40); }); }
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
/* Authoring rule: correct option is first. Shuffle with a seed so the screen order is stable between visits. */
function prepQ(q) {
  if (q._prep) return q;
  if (q.fixed) { q.opts = ['A', 'B', 'C', 'D', 'E (not given in any paragraph)']; q.correct = 'ABCDE'.indexOf(q.a); }
  else {
    const opts = q.o.map((t, i) => ({ t, ok: i === 0 })); const r = rng(hash((TEST ? TEST.id : 'X') + '|' + q.id));
    for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
    q.opts = opts.map(o => o.t); q.correct = opts.findIndex(o => o.ok);
  }
  q._prep = true; return q;
}
const qNum = id => Number(String(id).split('.').pop());

/* ============================== computer voices (Listening audio) ============================== */
const Voice = {
  list: [], ok: false,
  async init() {
    if (!('speechSynthesis' in window)) return;
    let v = speechSynthesis.getVoices();
    if (!v.length) { await new Promise(r => { let done = false; const fin = () => { if (!done) { done = true; r(); } }; speechSynthesis.addEventListener('voiceschanged', fin, { once: true }); setTimeout(fin, 2500); }); v = speechSynthesis.getVoices(); }
    this.list = v.filter(x => /^en/i.test(x.lang) && !/\bAna\b|Maisie|child|kid/i.test(x.name)); this.ok = this.list.length > 0;
  },
  gender(v) {
    const n = v.name;
    if (/female|zira|jenny|aria|hazel|susan|samantha|linda|heera|catherine|natasha|clara|emma|\bava\b|allison|karen|moira|tessa|fiona|libby|sonia|michelle|joanna|kimberly|salli|ivy|serena|victoria|google us english|jane|sara|nancy|amber|ashley|cora|elizabeth|monica|natasha|clara|leah|molly|emily/i.test(n)) return 'f';
    if (/male|david|mark|george|guy|daniel|ryan|james|liam|christopher|eric|brian|matthew|justin|joey|fred|alex|thomas|william|richard|sean|connor|andrew|roger|steffan|davis|jason|tony|brandon|jacob/i.test(n)) return 'm';
    return '?';
  },
  rank(v) {
    let s = 0;
    if (/en[-_]CA/i.test(v.lang)) s += 30; else if (/en[-_]US/i.test(v.lang)) s += 25; else if (/en[-_]GB/i.test(v.lang)) s += 12; else s += 6;
    if (/natural|neural/i.test(v.name)) s += 60; else if (/online/i.test(v.name)) s += 40;
    if (/google/i.test(v.name)) s += 8;
    return s;
  },
  natural() { return this.list.filter(v => /natural|neural/i.test(v.name)); },
  canadian() { return this.natural().filter(v => /en[-_]CA/i.test(v.lang)); },
  narrator() { const en = [...this.list].sort((a, b) => this.rank(b) - this.rank(a)); return { voice: en[0] || null, pitch: 1, rate: 1 }; },
  assign(cast) {
    const en = [...this.list].sort((a, b) => this.rank(b) - this.rank(a));
    const pool = { f: en.filter(v => this.gender(v) === 'f'), m: en.filter(v => this.gender(v) === 'm') };
    const used = { f: 0, m: 0 }, out = {};
    Object.entries(cast).forEach(([k, c]) => {
      const g = c.g === 'm' ? 'm' : 'f';
      const list = pool[g].length ? pool[g] : en;
      const i = used[g]++;
      const v = list.length ? list[i % list.length] : null;
      let pitch = 1;

/* ============================== exam structure ============================== */
function buildScreens() {

      part.segments.forEach((seg, si) => {

  }
  if (sel.W) {
    S.push({ type: 'info', sec: 'W', title: 'Writing Test', html: '<h2>Writing Test Instructions</h2><ul><li>The Writing Test has 2 tasks: an email (27 minutes) and a survey response (26 minutes).</li><li>There is no spell check, just like the real test. Leave time to reread your work.</li><li>Your writing is saved automatically every few seconds and saved to a file when each task ends.</li></ul>' });
    T.writing.tasks.forEach(task => S.push({ type: 'writing', sec: 'W', title: 'Writing ' + task.title, task, group: { id: task.id, seconds: task.minutes * 60 } }));

/* ============================== timer ============================== */
function setTimerVisible(v) { $('#timer').hidden = !v; $('#pauseBtn').hidden = !(v && STATE && STATE.mode === 'practice'); }
function syncTimer(sc) {
  const g = sc.group;
  if (!g) { TIMER = null; setTimerVisible(false); return; }
  if (TIMER && TIMER.id === g.id) return;
  if (g.waitAudio && STATE.timeLeft[g.id] == null) { TIMER = null; setTimerVisible(false); return; }
  startTimer(g);
}
function startTimer(g) {
  if (TIMER && TIMER.id === g.id) return;
  const left = STATE.timeLeft[g.id] != null ? STATE.timeLeft[g.id] : g.seconds;
  TIMER = { id: g.id, endAt: Date.now() + left * 1000 }; setTimerVisible(true); tick();
}
let lastPersistTick = 0;
function tick() {
  if (!TIMER || PAUSED) return;
  const left = (TIMER.endAt - Date.now()) / 1000;
  STATE.timeLeft[TIMER.id] = Math.max(0, left);
  const t = $s('#timer'); t.innerHTML = `Time remaining: <b>${fmtLong(left)}</b>`; t.classList.toggle('low', left <= 60);
  if (Date.now() - lastPersistTick > 4000) { lastPersistTick = Date.now(); persist(); }
  if (left <= 0) { const id = TIMER.id; TIMER = null; logEv('time up: ' + id); timeUp(id); }
}
setInterval(tick, 250);
function timeUp(gid) {
  let last = -1; SCREENS.forEach((s, i) => { if (s.group && s.group.id === gid) last = i; });
  toast('Time is up for this part. Moving on.'); go(last + 1);
}
function pause(on) {
  if (!TIMER) return;
  PAUSED = on; $('#pauseLayer').hidden = !on;
  if (on) TIMER.left = (TIMER.endAt - Date.now()) / 1000; else TIMER.endAt = Date.now() + TIMER.left * 1000;
}
$('#pauseBtn').onclick = () => pause(true);
$('#resumeBtn').onclick = () => pause(false);

/* ============================== navigation ============================== */
function setNext(show, label = 'NEXT', enabled = true) { const b = $('#nextBtn'); b.hidden = !show; b.textContent = label; b.disabled = !enabled; }
$('#nextBtn').onclick = async () => {

};
function leave() { const c = CUR; CUR = {}; if (c.cleanup) { try { c.cleanup(); } catch (e) { console.error(e); } } }
function go(i) {

}

/* Parts 4 to 6: every question for the part on one screen, one timer. */
function rLSet(sc) {
  const qs = sc.seg.questions;
  const label = { L4: 'news item', L5: 'discussion', L6: 'report' }[sc.part.id] || 'recording';
  const f = split(`<div class="instruction">Answer the questions about the ${label} you just heard. You can answer them in any order.</div>
      <div class="sbox"><div class="ico">${ICON.info}</div><div class="txt">Click NEXT when you have finished. You cannot come back to these questions.</div></div>`,
    `<div class="instruction">Choose the <span class="key">best</span> option to answer each question.</div>
      <div class="qlist">${qs.map((q, i) => `<div class="qrow"><span class="n">${i + 1}.</span><div>${esc(q.q)}<br>${ddHtml(q, 'Question ' + (i + 1))}</div></div>`).join('')}</div>`);
  $$('select.dd', f).forEach(s => s.onchange = () => { const id = s.dataset.q; if (s.value === '') delete STATE.answers[id]; else STATE.answers[id] = Number(s.value); s.classList.toggle('filled', s.value !== ''); persist(); });
  setNext(true);
  CUR.beforeNext = async () => {
    const miss = qs.filter(q => STATE.answers[q.id] == null).length;
    if (!miss) return true;
    return ask(`<h3>${miss} question${miss > 1 ? 's are' : ' is'} not answered</h3><p>You cannot come back to this part. Leave ${miss > 1 ? 'them' : 'it'} blank and continue?</p>`);
  };
}

function ddHtml(q, label) {
  prepQ(q); const v = STATE.answers[q.id];
  return `<select class="dd ${v != null ? 'filled' : ''}" data-q="${q.id}" aria-label="${esc(label)}"><option value="">Select an answer</option>${q.opts.map((o, i) => `<option value="${i}" ${v === i ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
}
function rReading(sc) {
  const p = sc.part;
  const qs = (p.questions || []);
  const blanks = (p.blanks || []);
  const qHtml = qs.length ? `<div class="qlist">${qs.map(q => `<div class="qrow"><span class="n">${qNum(q.id)}.</span><div>${esc(q.q)}<br>${ddHtml(q, 'Question ' + qNum(q.id))}</div></div>`).join('')}</div>` : '';
  let reply = p.reply || '';
  blanks.forEach(b => { reply = reply.replace(`[[${b.id}]]`, `<span class="blank"><b>${qNum(b.id)}.</b>${ddHtml(b, 'Blank ' + qNum(b.id))}</span>`); });
  const replyHtml = reply ? `<div class="passage ${qs.length ? 'reply' : ''}">${reply}</div>` : '';
  const replyFirst = blanks.length && qs.length && qNum(blanks[0].id) < qNum(qs[0].id);
  const right = replyFirst ? replyHtml.replace('passage reply', 'passage') + `<div class="reply">${qHtml}</div>` : qHtml + replyHtml;
  const f = split(`<div class="instruction">${esc(p.instructions)}</div><div class="passage">${p.passage}</div>`, right);
  $$('select.dd', f).forEach(s => s.onchange = () => { const id = s.dataset.q; if (s.value === '') delete STATE.answers[id]; else STATE.answers[id] = Number(s.value); s.classList.toggle('filled', s.value !== ''); persist(); });
  setNext(true);
  CUR.beforeNext = async () => {
    const miss = [...qs, ...blanks].filter(q => STATE.answers[q.id] == null).length;
    if (!miss) return true;
    return ask(`<h3>${miss} question${miss > 1 ? 's are' : ' is'} not answered</h3><p>You cannot come back to this part. Leave ${miss > 1 ? 'them' : 'it'} blank and continue?</p>`);
  };
}

function rWriting(sc) {
  const t = sc.task; const W = STATE.writing[t.id] = STATE.writing[t.id] || { text: '', option: null, startedAt: new Date().toISOString(), drafts: 0 };
  const optHtml = t.options ? `<div style="margin-bottom:10px">${t.options.map(o => `<label class="choice ${W.option === o.key ? 'sel' : ''}"><input type="radio" name="wopt" value="${o.key}" ${W.option === o.key ? 'checked' : ''}><span><b>${esc(o.label)}:</b> ${esc(o.text)}</span></label>`).join('')}</div>` : '';
  const f = split(`<div class="instruction">Read the following information.</div><h3>${esc(t.title)}</h3><div class="passage">${t.prompt}</div>${t.options ? '<p><b>Choose one option on the right, then write your answer.</b></p>' : ''}`,
    `${optHtml}<div class="toolbar"><button class="btn" data-cmd="cut">Cut</button><button class="btn" data-cmd="copy">Copy</button><button class="btn" data-cmd="paste">Paste</button><button class="btn" data-cmd="undo">Undo</button><button class="btn" data-cmd="redo">Redo</button></div>
    <textarea class="editor" id="ed" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Your response">${esc(W.text)}</textarea>
    <div class="wcount"><span id="wc">Word count: 0</span><span id="wsave" class="muted"></span></div>`);
  const ed = $('#ed', f);
  const upd = () => { W.text = ed.value; W.words = wc(ed.value); const n = W.words; const el = $('#wc'); el.textContent = `Word count: ${n}`; el.style.color = n > t.maxWords ? 'var(--warn)' : ''; persist(); };
  ed.oninput = upd; upd(); ed.focus();
  $$('input[name=wopt]', f).forEach(r => r.onchange = () => { W.option = r.value; $$('.choice', f).forEach(c => c.classList.toggle('sel', c.contains(r))); persist(); });
  $$('.toolbar .btn', f).forEach(b => b.onclick = async () => {
    ed.focus(); const cmd = b.dataset.cmd;
    if (cmd === 'paste') { try { const txt = await navigator.clipboard.readText(); document.execCommand('insertText', false, txt); } catch (_) { toast('Paste with Ctrl+V instead.'); } }
    else document.execCommand(cmd); upd();
  });
  const draftIv = setInterval(() => {
    if (!W.text.trim()) return; W.drafts++;
    Store.save(fileName(`${t.id}-draft`, 'txt'), draftText(t, W, 'Draft snapshot'), false);
    $('#wsave').textContent = `Draft saved at ${new Date().toLocaleTimeString('en-CA')}`;
  }, 5 * 60 * 1000);
  setNext(true);
  CUR.beforeNext = async () => {
    if (t.options && !W.option) return ask('<h3>No option selected</h3><p>You have not chosen Option A or Option B. Continue anyway?</p>');
    if (W.words < t.minWords) return ask(`<h3>Your response has ${W.words} words</h3><p>The task asks for ${t.minWords} to ${t.maxWords} words. You cannot come back. Continue anyway?</p>`);
    return true;
  };
  CUR.cleanup = () => {
    clearInterval(draftIv); W.text = ed.value; W.words = wc(ed.value); W.endedAt = new Date().toISOString();
    W.secondsUsed = Math.round(t.minutes * 60 - (STATE.timeLeft[t.id] || 0));
    persist(true); logEv(`writing ${t.id} submitted (${W.words} words)`);
    Store.save(fileName(t.id === 'W1' ? 'W1-email' : 'W2-survey', 'txt'), draftText(t, W, 'Final response'));
  };
}
function draftText(t, W, kind) {
  const opt = t.options && W.option ? `\nOption chosen: ${W.option} (${(t.options.find(o => o.key === W.option) || {}).text || ''})` : '';
  return `${kind}\nCandidate: ${STATE.name}\nTest: ${TEST.title}, ${t.title}\nSaved: ${niceTime()}\nWords: ${wc(W.text)}${opt}\n\nPROMPT\n${stripHtml(t.prompt)}\n\nRESPONSE\n${W.text}\n`;
}

function rSpeak(sc) {
  const t = sc.task, practiceMode = STATE.mode === 'practice', isCompare = t.type === 'compare';
  const S = STATE.speaking[t.id] = STATE.speaking[t.id] || {};
  const img = t.image ? `<div class="pic">${t.image}</div>` : '';
  const cards = (list, cls) => `<div class="cards">${list.map(c => `<button class="card ${cls || ''} ${S.choice === c.key ? 'sel' : ''}" data-k="${c.key}">${c.image}<h4>${esc(c.title)}</h4><ul>${c.facts.map(x => `<li>${esc(x)}</li>`).join('')}</ul></button>`).join('<span class="or">or</span>')}</div>`;
  const leftHtml = () => {
    if (!isCompare) return `<div class="instruction">${esc(t.title)}</div><div class="prompt passage">${t.prompt.startsWith('<') ? t.prompt : `<p>${esc(t.prompt)}</p>`}</div>${img}`;
    if (S.stage !== 'persuade') return `<h3>${esc(t.title)}</h3><p>${esc(t.prompt)}</p><p class="muted small">Click the option you prefer.</p>${cards(t.choices)}`;
    const mine = t.choices.find(c => c.key === S.choice);
    return `<h3>${esc(t.title)}</h3><p><b>${esc(t.persuade)}</b></p>${cards([mine || t.choices[0], t.third].filter(Boolean), 'locked')}<p class="small muted">${mine ? `Your choice: ${esc(mine.title)}.` : 'You did not choose an option. Pick one in your mind and argue for it.'}</p>`;
  };
  const f = split(`<div id="sLeft">${leftHtml()}</div>`,
    `<div class="prep" id="ph"><div class="ico" id="pIco">${ICON.clock}</div><div class="txt"><div class="pname" id="pName">Preparation time</div><div class="count" id="pCount">0:00</div><div class="pbar18"><i id="pBar"></i></div><div class="meter" id="meterWrap" hidden><i id="meter"></i></div></div></div>
      <p class="small" id="pMsg" style="text-align:center;margin:14px auto 0;max-width:350px"></p>
      ${sc.practice ? '<p class="small muted" style="text-align:center">This practice task is recorded but not scored.</p>' : ''}
      ${Mic.live() ? '' : '<p class="status warn small" style="max-width:350px;margin:10px auto 0">The microphone is off, so this response will not be recorded. Allow the microphone in the address bar to record.</p>'}`);
  const bindCards = () => $$('.card:not(.locked)', f).forEach(b => b.onclick = () => { S.choice = b.dataset.k; $$('.card', f).forEach(x => x.classList.toggle('sel', x === b)); persist(); });
  bindCards();
  let cancelled = false, phaseEnd = null, skip = null, recorder = null, meterIv = 0;
  CUR.cleanup = () => { cancelled = true; if (skip) skip(); clearInterval(meterIv); if (recorder) { const r = recorder; recorder = null; finishRec(r); } };
  const runPhase = (name, secs, cls) => new Promise(res => {
    const ph = $s('#ph'); ph.className = 'prep ' + (cls || ''); $s('#pIco').innerHTML = cls === 'rec' ? ICON.mic : ICON.clock; $s('#pName').innerHTML = cls === 'rec' ? `<span class="dot"></span>${name}` : name;
    const end = Date.now() + secs * 1000; let done = false;
    const fin = () => { if (done) return; done = true; clearInterval(iv); skip = null; res(); };
    skip = fin;
    const iv = setInterval(() => { if (cancelled) return fin(); const left = (end - Date.now()) / 1000; $s('#pCount').textContent = fmtShort(left); $s('#pBar').style.width = Math.min(100, (1 - left / secs) * 100) + '%'; if (left <= 0) fin(); }, 100);
  });
  const finishRec = async r => {
    clearInterval(meterIv);
    const out = await r.stop();
    const label = `${t.id}-${t.title.replace(/^Task \d+:\s*/, '').replace(/[^A-Za-z]+/g, '-').replace(/-+$/, '').toLowerCase()}`;
    const ext = /ogg/.test(out.mime) ? 'ogg' : /mp4/.test(out.mime) ? 'm4a' : 'webm';
    const audioName = fileName(label, ext);
    S.file = audioName; S.seconds = out.seconds; S.transcript = out.transcript; S.srUsed = out.srUsed; S.savedAt = new Date().toISOString();
    AUDIO_URLS[t.id] = URL.createObjectURL(out.blob);
    await Store.save(audioName, out.blob);
    Store.save(fileName(label + '-transcript', 'txt'), `Automatic transcript (approximate, made by the browser's speech recognition)\nCandidate: ${STATE.name}\n${t.title}\nPrompt: ${stripHtml(t.prompt)}${S.choice ? `\nChoice: ${S.choice}` : ''}\nRecorded: ${niceTime()}\nLength: ${out.seconds} seconds\n\n${out.transcript || '(No transcript captured. Listen to the audio file.)'}\n`);
    persist(true); logEv(`speaking ${t.id} saved`);
  };
  const flow = async () => {
    setNext(practiceMode, 'SKIP', true);
    CUR.beforeNext = async () => { if (skip) skip(); return false; };
    if (isCompare && S.stage !== 'persuade') {
      $s('#pMsg').textContent = 'Choose the option you prefer.';
      await runPhase('Selection time', t.select);
      if (cancelled) return;
      S.stage = 'persuade'; persist(); $s('#sLeft').innerHTML = leftHtml();
    }
    $s('#pMsg').textContent = 'Plan what you will say. Recording starts after the beep.';
    await runPhase('Preparation time', t.prep);
    if (cancelled) return;
    beep();
    if (Mic.live()) {
      try { recorder = Mic.record(STATE.transcribe); } catch (e) { console.warn(e); recorder = null; }
      $s('#meterWrap').hidden = false; meterIv = setInterval(() => { const m = $s('#meter'); if (m) m.style.width = (Mic.level() * 100) + '%'; }, 90);
    }
    $s('#pMsg').textContent = recorder ? 'Speak now. Keep talking until the time ends.' : 'Speak now. (Not recorded: microphone is off.)';
    await runPhase('Recording', t.speak, 'rec');
    if (cancelled) return;
    beep();
    $s('#meterWrap').hidden = true;
    if (recorder) { const r = recorder; recorder = null; $s('#pName').textContent = 'Saving'; $s('#pMsg').textContent = 'Saving your response...'; await finishRec(r); }
    $s('#pName').textContent = 'Response saved'; $s('#pMsg').textContent = S.file ? `Saved as ${S.file}` : 'Moving to the next task.';
    await sleep(1600);
    if (!cancelled) go(STATE.idx + 1);
  };
  flow();
}

function rEnd(sc) {

  setNext(true);
}

/* ============================== scoring + evaluation pack ============================== */
const L_TABLE = [[37, 12], [36, 11], [35, 10], [33, 9], [30, 8], [27, 7], [22, 6], [17, 5], [11, 4], [7, 3]];
const R_TABLE = [[37, 12], [35, 11], [33, 10], [31, 9], [28, 8], [24, 7], [19, 6], [15, 5], [10, 4], [8, 3]];
function allQ(sec) {
  if (sec === 'L') return TEST.listening.parts.flatMap(p => p.segments.flatMap(s => s.questions));
  return TEST.reading.parts.flatMap(p => [...(p.questions || []), ...(p.blanks || [])].sort((a, b) => qNum(a.id) - qNum(b.id)).map(q => Object.assign(q, { part: p.id })));
}
function score(sec) {
  const items = allQ(sec).map(prepQ); let c = 0;
  const rows = items.map(q => { const a = STATE.answers[q.id]; const ok = a != null && a === q.correct; if (ok) c++; return { q, a, ok }; });
  const n = items.length, raw38 = n === 38 ? c : Math.round(c * 38 / n);
  const tbl = sec === 'L' ? L_TABLE : R_TABLE; let level = 'M (0 to 2)';
  for (const [min, lv] of tbl) if (raw38 >= min) { level = String(lv); break; }
  return { c, n, level, rows };
}
function evalPack() {
  const L = STATE.sections.L ? score('L') : null, R = STATE.sections.R ? score('R') : null;
  const out = [];
  out.push(`# CELPIP Mock Exam: Evaluation Pack`, ``, `- Candidate: ${STATE.name}`, `- Test: ${TEST.title} (unofficial practice, original content)`, `- Mode: ${STATE.mode === 'exam' ? 'Exam (audio once, no pause)' : 'Practice'}`, `- Started: ${niceTime(new Date(STATE.startedAt))}`, `- Finished: ${niceTime()}`, `- Saved in: ${Store.where()}`, ``);
  out.push(`## Automatic scores`, ``);
  if (L) out.push(`- Listening: ${L.c} of ${L.n} correct. Approximate CELPIP level ${L.level}.`);
  if (R) out.push(`- Reading: ${R.c} of ${R.n} correct. Approximate CELPIP level ${R.level}.`);
  out.push(`- Writing and Speaking: need grading (see the request at the end).`, ``);
  const reviewTable = (S, sec) => {
    out.push(`| Question | Chosen | Correct answer | Result |`, `|---|---|---|---|`);
    S.rows.forEach(r => out.push(`| ${sec === 'L' ? r.q.id : r.q.part + ' Q' + qNum(r.q.id)} | ${r.a == null ? '(blank)' : r.q.opts[r.a]} | ${r.q.opts[r.q.correct]} | ${r.ok ? 'Correct' : 'Wrong'} |`));
    out.push('');
  };
  if (L) { out.push(`## Listening review`, ``); reviewTable(L, 'L'); }
  if (R) { out.push(`## Reading review`, ``); reviewTable(R, 'R'); }
  if (STATE.sections.W) {
    out.push(`## Writing`, ``);
    TEST.writing.tasks.forEach(t => {
      const W = STATE.writing[t.id] || {};
      out.push(`### ${t.title}`, ``, `**Prompt:** ${stripHtml(t.prompt).replace(/\n+/g, ' ')}`, ``);
      if (t.options) out.push(`**Option chosen:** ${W.option || '(none)'}${W.option ? ' (' + t.options.find(o => o.key === W.option).text + ')' : ''}`, ``);
      out.push(`**Word count:** ${wc(W.text)} (target ${t.minWords} to ${t.maxWords}). **Time used:** ${W.secondsUsed != null ? fmtLong(W.secondsUsed) : 'unknown'} of ${t.minutes} minutes.`, ``, '```text', W.text || '(no response)', '```', ``);
    });
  }
  if (STATE.sections.S) {
    out.push(`## Speaking`, ``, `Audio files are in the same folder as this file. Transcripts below were made automatically by the browser and may contain errors; the audio is the true record.`, ``);
    [TEST.speaking.practice, ...TEST.speaking.tasks].forEach(t => {
      const S = STATE.speaking[t.id] || {};
      out.push(`### ${t.title}${t === TEST.speaking.practice ? ' (practice, not scored)' : ''}`, ``, `**Prompt:** ${stripHtml(t.prompt).replace(/\n+/g, ' ')}`, ``);
      if (t.type === 'compare') out.push(`**Choice:** ${S.choice ? t.choices.find(c => c.key === S.choice).title : '(none)'}; persuading against: ${t.third.title}.`, ``);
      out.push(`**Preparation:** ${t.prep} s. **Speaking time:** ${t.speak} s. **Recorded:** ${S.seconds != null ? S.seconds + ' s' : 'no recording'}. **Audio file:** ${S.file || '(none)'}`, ``, `> ${S.transcript ? S.transcript : '(no transcript)'}`, ``);
    });
  }
  out.push(`## Exam log`, ``, ...STATE.log.map(l => `- ${new Date(l.t).toLocaleTimeString('en-CA')}: ${l.ev}`), ``);
  out.push(`## Request for Claude`, ``, `Please grade this CELPIP-General mock exam for ${STATE.name}. For Writing and Speaking, use the official CELPIP performance standards (Content/Coherence, Vocabulary, Readability or Listenability, Task Fulfillment) and give each task an estimated CELPIP level with specific feedback and examples of better phrasing. Listen to the audio files, not just the transcripts. Then give an overall CLB summary for all four skills and a short study plan focused on the weakest skill.`);
  return out.join('\n');
}

    ${L ? `<details><summary>Listening answers</summary>${review(L, 'L')}</details>` : ''}${R ? `<details><summary>Reading answers</summary>${review(R, 'R')}</details>` : ''}${transcripts}${speak}
    <details><summary>Files saved this attempt (${STATE.savedFiles.length})</summary><div class="files">${STATE.savedFiles.map(esc).join('\n') || 'None yet'}</div></details>`);
  $('#copyReq').onclick = async () => { const txt = grabRequest(); try { await navigator.clipboard.writeText(txt); $('#copyMsg').textContent = 'Copied. Paste it into Claude.'; } catch (_) { const ta = $('#reqText'); ta.hidden = false; ta.value = txt; ta.select(); $('#copyMsg').textContent = 'Select and copy the text below.'; } };
  $('#resave').onclick = () => { Store.save(fileName('EVALUATION', 'md'), evalPack()); $('#copyMsg').textContent = 'Saved again with a new time stamp.'; };
  $('#newAttempt').onclick = () => { try { localStorage.removeItem(LS_KEY); } catch (_) { } location.reload(); };
}

/* ============================== start screen ============================== */
function knownNames() { try { return JSON.parse(localStorage.getItem('rowe-celpip-mock.names') || '[]'); } catch (_) { return []; } }
function rememberName(n) { try { const l = knownNames().filter(x => x !== n); l.unshift(n); localStorage.setItem('rowe-celpip-mock.names', JSON.stringify(l.slice(0, 6))); } catch (_) { } }
function voiceLine() {
  if (REC_READY) return '<div class="status ok">Natural recorded voices are ready for this test. Every conversation and question plays from a recording, the same on every device.</div>';
  if (!Voice.ok) return '<div class="status bad">No computer voices found. Open this page in Microsoft Edge.</div>';
  const ca = Voice.canadian(), nat = Voice.natural();
  if (ca.length) return `<div class="status ok">Natural Canadian voices found (${esc(ca.map(v => v.name.replace(/Microsoft |Online |\(Natural\)| - .*$/g, '').trim()).join(', '))}), plus ${nat.length - ca.length} other natural voices. Real recordings in the tests\\audio folder are used first when present.</div>`;
  if (nat.length) return `<div class="status ok">Natural voices found (${nat.length}), but no Canadian ones. For Canadian accents, open this page in Microsoft Edge.</div>`;
  return '<div class="status warn">Only basic computer voices were found, so the listening audio will sound robotic. <b>Open this page in Microsoft Edge</b> (right-click the file, Open with, Microsoft Edge) to get natural Canadian voices.</div>';
}
async function renderStart() {
  $('#barTitle').textContent = 'CELPIP-style Mock Exam'; setNext(false); setTimerVisible(false);
  const tests = window.MOCK_TESTS || [];
  let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (_) { }
  if (saved && saved.finished) saved = null;
  const folderLine = () => !Store.supported() ? '<div class="status warn">This browser cannot save to a folder. Answers will be downloaded to your Downloads folder instead. Use Chrome or Edge for folder saving.</div>'
    : Store.root ? `<div class="status ok">Save folder: <b>${esc(Store.root.name)}</b>. Answers go into <b>${esc(Store.root.name === 'responses' ? 'responses' : Store.root.name + '\\responses')}</b>. Chrome may ask you to allow access when you start.</div>`
      : '<div class="status warn">No save folder chosen yet. Click <b>Choose save folder</b> and select your <b>Celpip test</b> folder in Documents.</div>';
  const names = knownNames();
  const f = frame(`<div class="start"><div>
    <h1>CELPIP-style Mock Exam</h1>
    <p class="muted">A full computer-based practice exam in the CELPIP-General format: Listening (with spoken audio and a video discussion), Reading, Writing and Speaking (recorded with your microphone). All questions are original practice material, not official CELPIP content.</p>
    ${saved ? `<div class="panel" style="margin-bottom:16px;border-color:var(--blue)"><div class="label">Unfinished attempt</div><p><b>${esc(saved.name)}</b>, started ${esc(niceTime(new Date(saved.startedAt)))}. Stopped at screen ${saved.idx + 1}.</p><div class="row"><button class="btn-blue" id="resumeAttempt">Resume this attempt</button><button class="btn" id="discardAttempt">Discard it</button></div></div>` : ''}
    <div class="field"><label for="cName"><b>Candidate name</b> (used in every saved file name)</label><input type="text" id="cName" list="nameList" autocomplete="off" value="${esc(names[0] || '')}" placeholder="For example: Jane Doe"><datalist id="nameList">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="field"><label for="cTest"><b>Test</b></label><select id="cTest">${tests.map(t => `<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></div>
    <div class="field"><b>Sections</b><div class="checks">
      <label><input type="checkbox" id="sL" checked> Listening (about 50 min)</label><label><input type="checkbox" id="sR" checked> Reading (about 45 min)</label>
      <label><input type="checkbox" id="sW" checked> Writing (53 min)</label><label><input type="checkbox" id="sS" checked> Speaking (about 20 min)</label></div></div>
    <div class="field"><b>Mode</b><div class="checks">
      <label><input type="radio" name="mode" value="exam" checked> Exam: audio plays once, no pausing, no skipping</label>
      <label><input type="radio" name="mode" value="practice"> Practice: replay audio, captions, pause and skip</label></div></div>
    <div class="field"><label class="checks"><label><input type="checkbox" id="cSR" checked> Make an automatic transcript of each speaking answer (needs internet; the audio is always saved; turn off if the browser keeps asking for the microphone)</label></label></div>
    <div class="field"><b>Listening voices</b><div id="voiceLine">${voiceLine()}</div><div class="row" style="margin-top:6px"><button class="btn" id="voiceTest">Hear a sample</button></div></div>
    <div class="field"><b>Save folder</b><div id="folderLine">${folderLine()}</div><div class="row" style="margin-top:6px"><button class="btn" id="pickFolder" ${Store.supported() ? '' : 'disabled'}>Choose save folder</button></div></div>
    <div class="row" style="margin-top:8px"><button class="btn-blue" id="startBtn">Start the test</button><span class="small" id="startMsg"></span></div>
  </div>
  <div>
    <div class="panel"><div class="label">Proctor checklist</div><ol class="small" style="padding-left:18px;margin:6px 0 0">
      <li>Use <b>Microsoft Edge</b> on the laptop (it has natural Canadian voices), with a headset and microphone.</li>
      <li>Phone on silent and away from the desk. Paper and pen only.</li>
      <li>The full test takes about 2 hours 50 minutes with no scheduled breaks. The clock keeps running.</li>
      <li>Every screen moves forward with NEXT. There is no going back.</li>
      <li>Each recording plays once in Exam mode. Take notes while listening.</li>
      <li>Do not help with answers during the test.</li>
      <li>When Chrome asks for the microphone or the folder, click <b>Allow</b>.</li></ol></div>
    <div class="panel" style="margin-top:14px"><div class="label">What gets saved</div><ul class="small" style="padding-left:18px;margin:6px 0 0">
      <li>A new folder for every attempt: <b>Name_date_time</b>.</li>
      <li>Every file name includes the candidate name, the attempt time and the save time, so nothing is ever overwritten.</li>
      <li>Writing: final text of each task, plus draft snapshots every 5 minutes.</li>
      <li>Speaking: one audio file per task, plus a transcript.</li>
      <li>At the end: an <b>EVALUATION</b> file for Claude to grade, and a full record.</li></ul></div>
  </div></div>`);
  $('#voiceTest', f).onclick = async () => { Voice.cancel(); const tok = { cancelled: false }; const r = await Media.play('_common/sample', ['mp3'], null, tok); if (r === 'missing' || r === 'blocked') await Voice.playLines([['A', 'Hi there. This is how the listening recordings will sound.'], ['B', 'And this is a second speaker, so you can hear the difference.']], { A: { g: 'f' }, B: { g: 'm' } }, {}, tok); };
  const refreshRec = async () => { await checkRecordings($('#cTest').value); const vl = $('#voiceLine'); if (vl) vl.innerHTML = voiceLine(); };
  $('#cTest', f).onchange = refreshRec; refreshRec();
  $('#pickFolder', f).onclick = async () => { try { await Store.pick(); $('#folderLine').innerHTML = folderLine(); } catch (e) { if (e && e.name !== 'AbortError') $('#folderLine').innerHTML = `<div class="status bad">Could not open the folder: ${esc(e.message || e)}</div>`; } };
  if (saved) {
    $('#resumeAttempt', f).onclick = async () => {
      const msg = $('#startMsg'); msg.className = 'small'; msg.textContent = saved.sections.S ? 'Allow the microphone when Chrome asks...' : '';
      const perm = await askPermissionsUpFront(saved.sections.S, saved.transcribe);
      saved.transcribe = perm.transcribe; beginExam(saved);
    };
    $('#discardAttempt', f).onclick = () => { try { localStorage.removeItem(LS_KEY); } catch (_) { } renderStart(); };
  }
  $('#startBtn', f).onclick = async () => {
    const name = $('#cName').value.trim(); const msg = $('#startMsg');
    if (!name) { msg.className = 'small status bad'; msg.textContent = 'Enter the candidate name first.'; $('#cName').focus(); return; }
    const sections = { L: $('#sL').checked, R: $('#sR').checked, W: $('#sW').checked, S: $('#sS').checked };
    if (!Object.values(sections).some(Boolean)) { msg.className = 'small status bad'; msg.textContent = 'Choose at least one section.'; return; }
    rememberName(name);
    const opts = { name, testId: $('#cTest').value, sections, mode: $$('input[name=mode]').find(r => r.checked).value, transcribe: $('#cSR').checked };
    msg.className = 'small'; msg.textContent = sections.S ? 'Allow the microphone when the browser asks. This is the only time it will ask.' : '';
    askPermissionsUpFront(sections.S, opts.transcribe).then(async perm => {
      if (sections.S && !perm.mic && !(await ask('<h3>Microphone blocked</h3><p>The Speaking answers cannot be recorded. Click the microphone icon in the address bar, choose Allow, then click Start again. Or continue without recording.</p>'))) { msg.textContent = ''; return; }
      opts.transcribe = perm.transcribe; beginExam(null, opts);
    });
  };
}
async function beginExam(saved, opts) {
  STATE = saved || newState(opts);
  TEST = (window.MOCK_TESTS || []).find(t => t.id === STATE.testId) || window.MOCK_TESTS[0];
  await checkRecordings(TEST.id);
  if (Store.root) await Store.open(STATE.folder); else Store.mode = 'download';
  SCREENS = buildScreens();
  $('#footWho').textContent = `${STATE.name} | ${TEST.title} | ${STATE.mode === 'exam' ? 'Exam mode' : 'Practice mode'} | Attempt ${STATE.stamp.replace('_', ' ')}`;
  if (!saved) {
    logEv('attempt started');
    Store.save(fileName('attempt-started', 'json'), JSON.stringify({ candidate: STATE.name, test: TEST.title, mode: STATE.mode, sections: STATE.sections, started: STATE.startedAt, userAgent: navigator.userAgent, voices: Voice.list.map(v => v.name) }, null, 2), false);
  } else logEv('attempt resumed');
  persist(true); render();
}
window.addEventListener('beforeunload', e => { if (STATE && !STATE.finished) { persist(true); e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  if (!(window.MOCK_TESTS || []).length) { frame('<h2>Test content not found</h2><p>Keep the <b>tests</b> folder next to this page. It must contain <b>mock_test_A.js</b>.</p>'); return; }
  frame('<p class="muted">Loading voices...</p>');
  await Promise.all([Voice.init(), Store.load()]);
  renderStart();
})();
</script>
</body>
</html>
