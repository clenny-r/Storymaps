<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>The Lost Sheep</title>
<script type="importmap">
{ "imports": { "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/+esm" } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Fredoka One','Comic Sans MS',cursive; touch-action:none; background:#8cc56a; }
  #game { position:relative; width:100vw; height:100vh; height:100dvh; overflow:hidden; background:linear-gradient(#7fb8e8,#b9dcf3); }
  .spot { position:absolute; width:14%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; }
  .spot.hint { box-shadow:0 0 0 4px rgba(255,255,255,.75), 0 0 24px 8px rgba(255,240,150,.6); animation:breathe 2s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{opacity:.35} 50%{opacity:1} }
  .lamb { position:absolute; width:12%; aspect-ratio:1; transform:translate(-50%,-80%); border-radius:50%; overflow:hidden; background:#fff; border:4px solid #fff; box-shadow:0 8px 18px rgba(0,0,0,.3); transition:left 2.2s ease-in-out, top 2.2s ease-in-out, width 2.2s; pointer-events:none; animation:popin .5s cubic-bezier(.34,1.56,.64,1); z-index:3; }
  @keyframes popin { 0%{transform:translate(-50%,-30%) scale(0)} 100%{transform:translate(-50%,-80%) scale(1)} }
  .peek { position:absolute; font-size:7vmin; transform:translate(-50%,-90%); pointer-events:none; animation:peek 1.4s ease-out forwards; }
  @keyframes peek { 0%{opacity:0;transform:translate(-50%,-40%)} 25%{opacity:1;transform:translate(-50%,-110%)} 100%{opacity:0;transform:translate(-50%,-160%)} }
  .pl-title { position:absolute; left:0; right:0; z-index:5; pointer-events:none; }
  #again { display:none; position:absolute; z-index:6; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 22px); transform:translateX(-50%); }
  #drag { position:absolute; z-index:5; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); text-align:center; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.5); font-size:1rem; pointer-events:none; }
</style>
</head>
<body data-kit-levels="1">
<div id="game">
  <a id="back-btn" href="index.html"></a>
  <div class="pl-title" id="title">Where is the little lost sheep? 🐑</div>
  <div id="drag">👈 Slide to look around 👉</div>
  <button class="pl-btn" id="again">Play again 🔁</button>
</div>
<script src="voice.js?v=20261028a"></script>
<script src="photos.js?v=20261028a"></script>
<script src="kit.js?v=20261028a"></script>
<script src="play.js?v=20261028a"></script>
<script>
/* Luke 15:3 to 7. A gentle hide and seek: the lost sheep hides behind a rock,
 * a bush or a log. Little ones get 2 glowing places, then 4, then 6 with two
 * lost sheep to find. Found sheep walk home to the fold. */
var SPOTS = [ {x:16,y:41,r:10,n:"rock"}, {x:39,y:40,r:8,n:"bush"}, {x:18,y:66,r:11,n:"log"},
              {x:63,y:61,r:10,n:"bush"}, {x:84,y:70,r:11,n:"rock"}, {x:78,y:51,r:8,n:"wall"} ];
var FOLD = {x:88, y:36};
var CRITTERS = [["🦋","Just a butterfly."],["🐞","Just a ladybug."],["🐦","Just a little bird."],["🌼","Just a flower."]];
var SET = {1:{n:2,sheep:1}, 2:{n:4,sheep:1}, 3:{n:6,sheep:2}};
var lvl=Play.level(), active=[], hidden=[], found=0, busy=false;
var game=document.getElementById('game'), title=document.getElementById('title'), again=document.getElementById('again');
var sc=Play.scene(game, 'art/hill.webp?v=20261028', {focus:.4, onTap:tap});

function start(){
  Array.prototype.slice.call(sc.el.querySelectorAll('.spot,.lamb')).forEach(function(e){ e.remove(); });
  var cfg=SET[lvl]; found=0; busy=false; again.style.display='none';
  // little ones: start with places already on screen; bigger children explore
  var v=sc.view(), onScreen=SPOTS.filter(function(s){ return s.x>v.from+3 && s.x<v.to-3; });
  var pool = (lvl===1 && onScreen.length>=2) ? onScreen : SPOTS;
  active = lvl===3 ? SPOTS.slice() : Play.shuffle(pool).slice(0,cfg.n);
  active.forEach(function(s){ s.checked=false; });
  hidden = Play.shuffle(active).slice(0,cfg.sheep);
  active.forEach(function(s){
    var d=document.createElement('div'); d.className='spot'+(lvl<3?' hint':''); d.style.left=s.x+'%'; d.style.top=s.y+'%'; d.style.width=(s.r*2)+'%'; s.el=d; sc.el.appendChild(d);
  });
  title.textContent = cfg.sheep>1 ? 'Find the two lost sheep! 🐑🐑' : 'Where is the little lost sheep? 🐑';
  Play.say(cfg.sheep>1 ? 'Two little sheep are lost! Can you find them?' : 'A little sheep is lost! Can you find it?');
}
function tap(x,y){
  if(busy) return;
  var s=null; active.forEach(function(a){ if(!s && Play.inSpot(x,y,[a.x,a.y,a.r])) s=a; });
  if(!s){ var pt=sc.pt(x,y); Play.floatUp(pt.x,pt.y,null,['🌼','🌸','✨'][Math.floor(Math.random()*3)],40); Play.tone(800+Math.random()*300,.08,'sine',.06); return; }
  if(hidden.indexOf(s)>=0){ hidden.splice(hidden.indexOf(s),1); foundSheep(s); return; }
  if(s.checked){ Play.bump(s.el,'pl-wig'); return; }
  s.checked=true;
  var c=CRITTERS[Math.floor(Math.random()*CRITTERS.length)], p=document.createElement('div');
  p.className='peek'; p.textContent=c[0]; p.style.left=s.x+'%'; p.style.top=s.y+'%'; sc.el.appendChild(p);
  setTimeout(function(){ p.remove(); },1500);
  if(s.el) s.el.classList.remove('hint');
  Play.pop(700); Play.say(c[1]+' Keep looking!');
}
function foundSheep(s){
  busy=true; found++;
  var l=document.createElement('div'); l.className='lamb'; l.style.left=s.x+'%'; l.style.top=s.y+'%'; sc.el.appendChild(l);
  BabyPhotos.fill(l,'sheep','🐑',{round:true});
  if(s.el) s.el.classList.remove('hint');
  Play.chime(); Play.tone(392,.3,'triangle',.12,.4);
  var more = hidden.length>0;
  Play.say(more ? 'You found one! Can you find the other one?' : 'You found the little lost sheep!', function(){
    if(more){ busy=false; return; }
    title.textContent='Home to the shepherd! 🏡';
    sc.pan(.85);
    Array.prototype.forEach.call(sc.el.querySelectorAll('.lamb'), function(e,i){ setTimeout(function(){ e.style.left=FOLD.x+'%'; e.style.top=(FOLD.y+i*4)+'%'; e.style.width='8%'; }, 300); });
    setTimeout(function(){
      Play.confetti(16); title.textContent='Everyone is so happy! 🎉';
      Play.say('The shepherd was so happy! Jesus loves you like that. He always comes to find you.', function(){ again.style.display='block'; });
    }, 2700);
  });
}
again.addEventListener('click', start);
Play.onLevel(function(n){ lvl=n; start(); });
start();
</script>
</body>
</html>
