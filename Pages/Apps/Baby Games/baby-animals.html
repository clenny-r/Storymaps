<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Animal Sounds</title>
<script type="importmap">
{ "imports": { "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/+esm" } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Fredoka One','Comic Sans MS',cursive; touch-action:none; }
  #game { width:100vw; height:100vh; position:relative; display:flex; flex-direction:column;
          background:radial-gradient(ellipse at 20% 20%,#C7F9A8 0%,transparent 55%),radial-gradient(ellipse at 85% 80%,#FFE9A3 0%,transparent 55%),linear-gradient(160deg,#5EEAD4,#60A5FA); }
  #title { text-align:center; color:#fff; font-size:clamp(1.3rem,5vw,2.4rem); text-shadow:0 3px 12px rgba(0,0,0,.3); padding:14px 60px 4px; min-height:2.2em; }
  #modes { display:flex; justify-content:center; gap:10px; padding:2px 10px 6px; }
  .mode { border:0; border-radius:999px; padding:9px 18px; font:inherit; font-size:clamp(.95rem,3.6vw,1.2rem); color:#1f5b4a;
          background:rgba(255,255,255,.55); cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.12); }
  .mode.on { background:#fff; color:#0f766e; }
  #grid { flex:1; display:grid; grid-template-columns:repeat(var(--cols,3),1fr); gap:clamp(8px,2.5vw,20px);
          padding:clamp(8px,2.5vw,22px) clamp(10px,3vw,26px) 16vh; align-content:start; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
  #grid.play { align-content:center; padding-bottom:12vh; }
  .animal { border-radius:26px; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; flex-direction:column;
            box-shadow:0 10px 26px rgba(0,0,0,.2); cursor:pointer; padding:6% 6% 3%; transition:transform .12s cubic-bezier(.34,1.56,.64,1); }
  .animal:active { transform:scale(.93); }
  .animal.bounce { animation:bounce .5s cubic-bezier(.34,1.56,.64,1); }
  .animal.wiggle { animation:wig .45s; }
  .animal.right { box-shadow:0 0 0 6px #ffe45e,0 10px 26px rgba(0,0,0,.2); }
  .animal.dim { opacity:.35; }
  @keyframes bounce { 0%{transform:scale(1)} 45%{transform:scale(1.12) rotate(-3deg)} 100%{transform:scale(1)} }
  @keyframes wig { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)} }
  .animal .emo { font-size:clamp(2.4rem,11vw,5rem); line-height:1; width:100%; aspect-ratio:1; border-radius:20px; overflow:hidden; background:#fff; }
  .animal .nm  { font-size:clamp(.8rem,3.4vw,1.35rem); color:#2f6b3a; margin-top:6px; }
  #grid.play .nm { visibility:hidden; }
  #grid.play.reveal .nm { visibility:visible; }
  #say { position:absolute; left:50%; bottom:5vh; transform:translateX(-50%); color:#fff; font-size:clamp(1.4rem,6vw,3rem);
         text-shadow:0 4px 16px rgba(0,0,0,.4); opacity:0; transition:opacity .25s; pointer-events:none; text-align:center; width:90vw; }
  #hear { display:none; margin:0 auto 4px; border:0; border-radius:999px; padding:8px 18px; font:inherit; font-size:1.05rem; color:#0f766e; background:#fff; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.15); }
  .confetti { position:absolute; font-size:2rem; pointer-events:none; z-index:60; animation:fall 1.1s ease-out forwards; }
  @keyframes fall { 0%{opacity:1;transform:translateY(0) rotate(0)} 100%{opacity:0;transform:translateY(55vh) rotate(280deg)} }
  .btn { position:absolute; z-index:100; background:rgba(255,255,255,.22); border:2px solid rgba(255,255,255,.4); color:#fff;
         border-radius:50px; padding:8px 16px; font-family:inherit; font-size:1rem; cursor:pointer; text-decoration:none; }
</style>
</head>
<body data-kit-levels="1">
<div id="game">
  <a id="back-btn" class="btn" href="../index.html">←</a>
  <div id="sound-btn" class="btn" onclick="toggleSound()">🔊</div>
  <div id="title">Tap an animal! 🐾</div>
  <div id="modes">
    <button class="mode on" id="mExplore">👀 Look &amp; listen</button>
    <button class="mode" id="mPlay">⭐ Find it!</button>
  </div>
  <button id="hear">🔁 Hear it again</button>
  <div id="grid"></div>
  <div id="say"></div>
</div>
<script src="voice.js?v=20261026b"></script>
<script src="photos.js?v=20261026b"></script>
<script src="kit.js?v=20261026b"></script>
<script>
/* lv = the first age level the animal appears at (1 under 2, 2 for 2 to 3,
 * 3 for 3 to 5). Little ones start with the farm animals they meet first
 * in picture books; each level keeps the earlier animals and adds more.
 * s = what it says, q = good for "Who says ...?" questions (level 3). */
var ANIMALS = [
  {e:"🐶",n:"Dog",s:"woof woof",f:300,lv:1,q:1},{e:"🐱",n:"Cat",s:"meow",f:600,lv:1,q:1},{e:"🐮",n:"Cow",s:"moo",f:150,lv:1,q:1},
  {e:"🦆",n:"Duck",s:"quack quack",f:520,lv:1,q:1},{e:"🐑",n:"Sheep",s:"baa",f:340,lv:1,q:1},{e:"🐷",n:"Pig",s:"oink oink",f:260,lv:1,q:1},

  {e:"🐴",n:"Horse",s:"neigh",f:400,lv:2,q:1},{e:"🐔",n:"Hen",s:"cluck cluck",f:480,lv:2,q:1},{e:"🐓",n:"Rooster",s:"cock a doodle doo",f:560,lv:2,q:1},
  {e:"🐸",n:"Frog",s:"ribbit",f:220,lv:2,q:1},{e:"🦁",n:"Lion",s:"roar",f:110,lv:2,q:1},{e:"🐘",n:"Elephant",s:"toot toot",f:130,lv:2,q:1},
  {e:"🐵",n:"Monkey",s:"ooh ooh aah aah",f:560,lv:2,q:1},{e:"🦉",n:"Owl",s:"hoo hoo",f:380,lv:2,q:1},{e:"🐝",n:"Bee",s:"buzz",f:700,lv:2,q:1},
  {e:"🐟",n:"Fish",s:"blub blub",f:640,lv:2},

  {e:"🐐",n:"Goat",s:"maa",f:420,lv:3,q:1},{e:"🫏",n:"Donkey",s:"hee haw",f:330,lv:3,q:1},{e:"🐭",n:"Mouse",s:"squeak squeak",f:900,lv:3,q:1},
  {e:"🐺",n:"Wolf",s:"aaooo",f:200,lv:3,q:1},{e:"🐯",n:"Tiger",s:"grrr",f:120,lv:3,q:1},{e:"🐻",n:"Bear",s:"grrr",f:140,lv:3},
  {e:"🐰",n:"Bunny",s:"hop hop",f:620,lv:3},{e:"🦋",n:"Butterfly",s:"flutter flutter",f:760,lv:3},{e:"🐧",n:"Penguin",s:"honk honk",f:450,lv:3},
  {e:"🦜",n:"Parrot",s:"hello hello",f:680,lv:3,q:1},{e:"🐬",n:"Dolphin",s:"click click eee",f:820,lv:3},{e:"🐋",n:"Whale",s:"ooo ooo",f:100,lv:3},
  {e:"🐫",n:"Camel",s:"hrrumph",f:180,lv:3},{e:"🦘",n:"Kangaroo",s:"boing boing",f:500,lv:3},{e:"🦛",n:"Hippo",s:"grunt grunt",f:120,lv:3},
  {e:"🦀",n:"Crab",s:"click clack",f:720,lv:3},{e:"🐿️",n:"Squirrel",s:"chitter chatter",f:860,lv:3},{e:"🦒",n:"Giraffe",s:"hmmm",f:240,lv:3},
  {e:"🦓",n:"Zebra",s:"hee hee",f:420,lv:3},{e:"🐢",n:"Turtle",s:"slow and steady",f:200,lv:3},
  {e:"🐦",n:"Hummingbird",s:"hum hum hum",f:880,lv:3,say:"The doctor bird, the hummingbird of Jamaica, says hum hum hum"}
];
// How each level plays (choices on screen in "Find it!", columns in the grid)
var PLAN = { 1:{choices:2, cols:2}, 2:{choices:3, cols:3}, 3:{choices:4, cols:3} };

var soundOn=true, actx=null, mode="explore", lvl=BabyKit.level(), target=null, qKind="where", busy=false;
function ctx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq){ if(!soundOn) return; try{ var c=ctx(); if(c.state!=="running") c.resume(); var o=c.createOscillator(),g=c.createGain(); o.connect(g); g.connect(c.destination);
  o.type='triangle'; o.frequency.setValueAtTime(freq,c.currentTime); o.frequency.linearRampToValueAtTime(freq*1.3,c.currentTime+.15);
  o.frequency.linearRampToValueAtTime(freq*.8,c.currentTime+.35); g.gain.setValueAtTime(.25,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4); o.start(); o.stop(c.currentTime+.42); }catch(e){} }
function chime(){ if(!soundOn) return; try{ var c=ctx(); [523,659,784,1047].forEach(function(f,i){ var o=c.createOscillator(),g=c.createGain(); o.connect(g); g.connect(c.destination);
  o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,c.currentTime+i*.09); g.gain.exponentialRampToValueAtTime(.25,c.currentTime+i*.09+.02);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.09+.35); o.start(c.currentTime+i*.09); o.stop(c.currentTime+i*.09+.4); }); }catch(e){} }
function say(t,cb){ if(!soundOn){ if(cb) setTimeout(cb,400); return; } BabyVoice.say(t,cb); }
function line(a){ return a.say || ('The ' + a.n + ' says ' + a.s); }
function pool(){ return ANIMALS.filter(function(a){ return a.lv <= lvl; }); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function caption(t){ var s=document.getElementById('say'); s.textContent=t; s.style.opacity='1'; clearTimeout(s._t); s._t=setTimeout(function(){ s.style.opacity='0'; },1800); }

var grid=document.getElementById('grid'), title=document.getElementById('title'), hear=document.getElementById('hear');
function card(a){
  var d=document.createElement('div'); d.className='animal';
  d.innerHTML='<div class="emo"></div><div class="nm">'+a.n+'</div>';
  BabyPhotos.fill(d.querySelector('.emo'), a.n.toLowerCase(), a.e, {alt:a.n});
  return d;
}

/* ── Look & listen ─────────────────────────────────────────────────────── */
function explore(){
  mode="explore"; busy=false; hear.style.display='none';
  grid.className=''; grid.style.setProperty('--cols', PLAN[lvl].cols);
  title.textContent='Tap an animal! 🐾'; grid.innerHTML='';
  pool().forEach(function(a){
    var d=card(a);
    d.addEventListener('click', function(){
      d.classList.remove('bounce'); void d.offsetWidth; d.classList.add('bounce');
      tone(a.f); caption(a.n+': '+a.s+'!'); say(line(a));
    });
    grid.appendChild(d);
  });
}

/* ── Find it! ──────────────────────────────────────────────────────────── */
function ask(){
  if(qKind==='sound') { title.textContent='Who says "'+target.s+'"? 👂'; say('Who says '+target.s+'?'); }
  else { title.textContent='Where is the '+target.n.toLowerCase()+'? 👀'; say('Can you find the '+target.n.toLowerCase()+'?'); }
}
function round(){
  mode="play"; busy=false; hear.style.display='block';
  var p=shuffle(pool().slice()), n=PLAN[lvl].choices;
  target=p[0];
  // "Who says...?" only for the big kids, and only for animals with a real sound
  qKind = (lvl===3 && target.q && Math.random()<.5) ? 'sound' : 'where';
  // never put two animals with the same sound side by side in a sound question
  var picks=[target];
  for(var i=1;i<p.length && picks.length<n;i++){ if(qKind!=='sound' || p[i].s!==target.s) picks.push(p[i]); }
  shuffle(picks);
  grid.className='play'; grid.style.setProperty('--cols', n===4?2:n); grid.innerHTML='';
  picks.forEach(function(a){
    var d=card(a);
    d.addEventListener('click', function(){ choose(a,d); });
    grid.appendChild(d);
  });
  ask();
}
function choose(a,d){
  if(busy) return;
  if(a===target){
    busy=true; d.classList.add('right'); grid.classList.add('reveal');
    Array.prototype.forEach.call(grid.children, function(c){ if(c!==d) c.classList.add('dim'); });
    chime(); tone(a.f); confetti(); caption('Yes! The '+a.n.toLowerCase()+'! 🎉');
    var moved=false; function next(){ if(moved) return; moved=true; if(mode==='play') round(); }
    say('Yes! '+line(a)+'!', function(){ setTimeout(next,700); });
    setTimeout(next, 6500);
  } else {
    // a gentle "no": name the one they touched, so even a miss teaches a word
    d.classList.remove('wiggle'); void d.offsetWidth; d.classList.add('wiggle');
    tone(a.f); caption('That is the '+a.n.toLowerCase());
    say('That is the '+a.n.toLowerCase()+'. '+(qKind==='sound' ? 'Who says '+target.s+'?' : 'Where is the '+target.n.toLowerCase()+'?'));
  }
}
function confetti(){ var g=document.getElementById('game'), ce="🎉🎈⭐🌟✨".split('');
  for(var i=0;i<14;i++){ var el=document.createElement('div'); el.className='confetti'; el.textContent=ce[Math.floor(Math.random()*ce.length)];
    el.style.left=(Math.random()*100)+'vw'; el.style.top='-8vh'; el.style.animationDelay=(Math.random()*.3)+'s'; g.appendChild(el);
    el.addEventListener('animationend', function(){ this.remove(); }); } }

function setMode(m){
  document.getElementById('mExplore').classList.toggle('on', m==='explore');
  document.getElementById('mPlay').classList.toggle('on', m==='play');
  if(m==='explore') explore(); else round();
}
document.getElementById('mExplore').addEventListener('click', function(){ setMode('explore'); });
document.getElementById('mPlay').addEventListener('click', function(){ setMode('play'); });
hear.addEventListener('click', ask);
document.addEventListener('babylevel', function(e){ lvl=e.detail; setMode(mode); });

function toggleSound(){ soundOn=!soundOn; if(!soundOn){ try{speechSynthesis.cancel();}catch(e){} } }
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ if(!e.target.closest('#grid')) e.preventDefault(); }, { passive:false });
explore();
</script>
</body>
</html>
