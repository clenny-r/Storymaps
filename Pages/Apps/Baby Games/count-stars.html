<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Count the Stars</title>
<script type="importmap">
{ "imports": { "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/+esm" } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Fredoka One','Comic Sans MS',cursive; touch-action:none; background:#0d1638; }
  #game { position:relative; width:100vw; height:100vh; height:100dvh; overflow:hidden; display:flex; flex-direction:column; }
  .bg { position:absolute; inset:0; background:url(art/night.webp?v=20261028) center bottom/cover, linear-gradient(#0b1440,#2a2b5e); z-index:0; }
  #sky { position:absolute; inset:0; z-index:2; }
  .star { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; pointer-events:none; animation:pop .5s cubic-bezier(.34,1.56,.64,1), twinkle 2.6s ease-in-out .5s infinite; }
  .star svg { width:100%; height:100%; filter:drop-shadow(0 0 10px #ffe680); }
  .star b { position:absolute; left:50%; top:100%; transform:translateX(-50%); color:#fff6c8; font-size:15px; text-shadow:0 0 6px #000; font-weight:normal; }
  @keyframes pop { 0%{transform:scale(0)} 100%{transform:scale(1)} }
  @keyframes twinkle { 0%,100%{opacity:1} 50%{opacity:.6} }
  #count { position:absolute; z-index:4; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); color:#fff6c8; font-size:clamp(2.4rem,10vw,4.5rem); text-shadow:0 0 18px #ffd400; }
  #again { display:none; position:absolute; z-index:5; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 24px); transform:translateX(-50%); }
  .pl-title { z-index:4; }
</style>
</head>
<body data-kit-levels="1">
<div id="game">
  <div class="bg"></div>
  <a id="back-btn" href="index.html"></a>
  <div class="pl-title" id="title">Tap the sky to make stars ✨</div>
  <div id="sky"></div>
  <div id="count"></div>
  <button class="pl-btn" id="again">More stars ✨</button>
</div>
<script src="voice.js?v=20261028a"></script>
<script src="photos.js?v=20261028a"></script>
<script src="kit.js?v=20261028a"></script>
<script src="play.js?v=20261028a"></script>
<script>
/* Genesis 15:5. A calm counting game for bedtime: tap the sky, Grace counts
 * each star; at the goal a short goodnight prayer and a music-box lullaby. */
var GOAL = {1:3, 2:10, 3:20};
var STAR = '<svg viewBox="0 0 50 50"><path d="M25 3l6.5 14.3 15.5 1.6-11.6 10.4 3.3 15.2L25 36.8 11.3 44.5l3.3-15.2L3 18.9l15.5-1.6z" fill="#ffe680" stroke="#fff6c8" stroke-width="2" stroke-linejoin="round"/></svg>';
var PENT = [523.25,587.33,659.25,783.99,880.00,1046.5,1174.7,1318.5];
var lvl=Play.level(), n=0, ended=false;
var sky=document.getElementById('sky'), countEl=document.getElementById('count'), title=document.getElementById('title'), again=document.getElementById('again');

function start(){
  sky.innerHTML=''; n=0; ended=false; countEl.textContent=''; again.style.display='none';
  title.textContent='Tap the sky to make stars ✨';
  Play.say('God told Abraham, look up at the sky and count the stars.');
}
sky.addEventListener('pointerdown', function(e){
  if(ended) return;
  var r=sky.getBoundingClientRect(), y=e.clientY-r.top;
  if(y > r.height*0.78) return;                       // keep the stars in the sky
  n++;
  var s=document.createElement('div'); s.className='star'; s.style.left=(e.clientX-r.left)+'px'; s.style.top=y+'px';
  s.innerHTML=STAR+(lvl>1?'<b>'+n+'</b>':''); sky.appendChild(s);
  Play.pluck(PENT[(n-1)%PENT.length], .35);
  countEl.textContent=n;
  if(n>=GOAL[lvl]){ ended=true; setTimeout(goodnight, 500); Play.say(Play.num(n)+'!'); return; }
  Play.say(Play.num(n)+'!');
});
function lullaby(){
  // Jesus Loves Me, first line, as a soft music box
  var mel=[392,329.6,329.6,293.7,329.6,392,392], t=0;
  mel.forEach(function(f,i){ setTimeout(function(){ Play.pluck(f*2,.28); }, t); t+= (i===6?900:560); });
}
function goodnight(){
  title.textContent='So many stars! 🌙'; Play.confetti(10,'⭐✨🌟');
  Play.say('So many stars! God made every one, and God made you.', function(){
    setTimeout(function(){
      title.textContent='Goodnight prayer 🙏';
      Play.say('Thank you God for this day. Thank you for my family. Keep us safe tonight. Amen.', function(){ lullaby(); again.style.display='block'; });
    }, 600);
  });
}
again.addEventListener('click', start);
Play.onLevel(function(v){ lvl=v; start(); });
start();
</script>
</body>
</html>
