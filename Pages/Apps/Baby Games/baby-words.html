<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>First Words</title>
<script type="importmap">
{ "imports": { "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/+esm" } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Fredoka One','Comic Sans MS',cursive; touch-action:none; }
  #game { width:100vw; height:100vh; position:relative; display:flex; flex-direction:column; align-items:center;
          background:radial-gradient(ellipse at 25% 25%,#ffe08a 0%,transparent 55%),radial-gradient(ellipse at 80% 75%,#8ce0ff 0%,transparent 55%),linear-gradient(160deg,#ff8fb1,#7c5cff); }
  #modes { display:flex; gap:10px; margin-top:calc(env(safe-area-inset-top,0px) + 62px); }
  .mode { border:0; border-radius:999px; padding:9px 18px; font:inherit; font-size:clamp(.95rem,3.6vw,1.2rem); color:#5b3fb8;
          background:rgba(255,255,255,.55); cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.12); }
  .mode.on { background:#fff; }
  #title { color:#fff; font-size:clamp(1.3rem,5.5vw,2.4rem); text-shadow:0 3px 12px rgba(0,0,0,.3); text-align:center; padding:8px 16px 0; min-height:1.6em; }
  #stage { flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:1vh 4vw 3vh; min-height:0; }

  /* Look & say: one big card. The picture sits INSIDE the card with a margin
     and is never cropped (object-fit: contain), whatever the screen shape. */
  #card { height:100%; max-height:min(78vw,58vh); aspect-ratio:1; border-radius:40px; background:#fff; display:flex; align-items:center; justify-content:center;
          box-shadow:0 20px 50px rgba(0,0,0,.28); cursor:pointer; transition:transform .14s cubic-bezier(.34,1.56,.64,1); position:relative; }
  #card:active { transform:scale(.96); }
  #card.pop { animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
  #pic { width:86%; height:86%; font-size:min(36vw,30vh); line-height:1; border-radius:24px; }
  #letter { position:absolute; top:12px; left:16px; font-size:clamp(1.4rem,5vw,2.2rem); color:#7c5cff; }
  #word { margin-bottom:2vh; font-size:clamp(2rem,10vw,4.2rem); color:#fff; text-shadow:0 4px 16px rgba(0,0,0,.35); text-transform:capitalize; letter-spacing:2px; min-height:1.2em; text-align:center; }
  #next { border:0; border-radius:999px; padding:10px 22px; font:inherit; font-size:1.1rem; color:#5b3fb8; background:#fff; cursor:pointer;
          box-shadow:0 4px 12px rgba(0,0,0,.15); margin-bottom:calc(env(safe-area-inset-bottom,0px) + 3vh); }

  /* Find it!: 2, 3 or 4 picture cards */
  #choices { display:none; width:100%; height:100%; gap:clamp(10px,3vw,22px); align-content:center; justify-content:center;
             grid-template-columns:repeat(var(--cols,2), var(--size,min(40vw,30vh))); }
  #choices .ch { aspect-ratio:1; background:#fff; border-radius:28px; box-shadow:0 10px 26px rgba(0,0,0,.22); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #choices .ch .bp { width:86%; height:86%; font-size:min(18vw,14vh); border-radius:18px; }
  #choices .ch.right { box-shadow:0 0 0 7px #ffe45e,0 10px 26px rgba(0,0,0,.22); }
  #choices .ch.dim { opacity:.35; }
  #choices .ch.wiggle { animation:wig .45s; }
  @keyframes wig { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)} }
  .play #card, .play #word, .play #next { display:none; }
  .play #choices { display:grid; }

  .confetti { position:absolute; font-size:2rem; pointer-events:none; z-index:60; animation:fall 1.1s ease-out forwards; }
  @keyframes fall { 0%{opacity:1;transform:translateY(0) rotate(0)} 100%{opacity:0;transform:translateY(55vh) rotate(280deg)} }
  .btn { position:absolute; z-index:100; background:rgba(255,255,255,.22); border:2px solid rgba(255,255,255,.4); color:#fff; border-radius:50px; padding:8px 16px; font-family:inherit; text-decoration:none; }
</style>
</head>
<body data-kit-levels="1">
<div id="game">
  <a id="back-btn" class="btn" href="../index.html">←</a>
  <div id="sound-btn" class="btn" onclick="toggleSound()">🔊</div>
  <div id="modes">
    <button class="mode on" id="mLook">👀 Look &amp; say</button>
    <button class="mode" id="mPlay">⭐ Find it!</button>
  </div>
  <div id="title">Tap the picture! 👆</div>
  <div id="stage">
    <div id="card"><span id="letter"></span><div id="pic">👋</div></div>
    <div id="choices"></div>
  </div>
  <div id="word"></div>
  <button id="next">Next ➡️</button>
</div>
<script src="voice.js?v=20261026b"></script>
<script src="photos.js?v=20261026b"></script>
<script src="kit.js?v=20261026b"></script>
<script>
/* lv: first age level that shows the word (1 under 2, 2 for 2 to 3, 3 for 3 to 5).
 * Level 1 keeps to the people and things a baby meets every day.
 * a:  how the word is said in a short sentence ("a ball", "some milk").
 * r:  a "Which one...?" riddle for the big kids (level 3), only where the
 *     answer is clear among all the pictures; x lists pictures that could
 *     also be right and must never be shown beside it. */
var WORDS = [
  {w:"Mommy",p:"👩",lv:1,a:"Mommy"},{w:"Daddy",p:"👨",lv:1,a:"Daddy"},{w:"baby",p:"👶",lv:1},
  {w:"ball",p:"⚽",lv:1,r:"we kick and throw"},{w:"dog",p:"🐶",lv:1},{w:"cat",p:"🐱",lv:1},
  {w:"milk",p:"🥛",lv:1,a:"some milk",r:"we drink, and it is white"},{w:"shoe",p:"👟",lv:1,r:"we wear on our feet"},
  {w:"apple",p:"🍎",lv:1,a:"an apple"},{w:"banana",p:"🍌",lv:1,r:"is long and yellow"},{w:"car",p:"🚗",lv:1},{w:"duck",p:"🦆",lv:1},

  {w:"cookie",p:"🍪",lv:2},{w:"cake",p:"🎂",lv:2,r:"we eat on a birthday"},{w:"bus",p:"🚌",lv:2,r:"takes children to school"},
  {w:"train",p:"🚂",lv:2,r:"goes choo choo on the tracks"},{w:"boat",p:"⛵",lv:2,r:"goes on the water"},{w:"fish",p:"🐟",lv:2},
  {w:"bear",p:"🐻",lv:2},{w:"bunny",p:"🐰",lv:2},{w:"teddy",p:"🧸",lv:2,a:"a teddy bear",r:"we cuddle at bedtime"},
  {w:"star",p:"⭐",lv:2},{w:"moon",p:"🌙",lv:2,a:"the moon",r:"we see in the sky at night"},{w:"sun",p:"☀️",lv:2,a:"the sun",r:"keeps us warm in the day"},
  {w:"flower",p:"🌻",lv:2},{w:"tree",p:"🌳",lv:2,r:"has leaves and branches"},{w:"bee",p:"🐝",lv:2,r:"makes honey"},
  {w:"butterfly",p:"🦋",lv:2},{w:"frog",p:"🐸",lv:2},{w:"cow",p:"🐮",lv:2,r:"gives us milk"},{w:"pig",p:"🐷",lv:2},
  {w:"sheep",p:"🐑",lv:2,r:"gives us wool"},{w:"horse",p:"🐴",lv:2},{w:"hen",p:"🐔",lv:2,r:"lays eggs",x:["duck"]},
  {w:"grapes",p:"🍇",lv:2,a:"some grapes"},{w:"orange",p:"🍊",lv:2,a:"an orange"},{w:"strawberry",p:"🍓",lv:2},
  {w:"ice cream",p:"🍦",lv:2,a:"an ice cream",r:"is cold and sweet",x:["snow"]},{w:"balloon",p:"🎈",lv:2,r:"floats away if you let go"},
  {w:"cup",p:"🥤",lv:2,r:"we drink from"},{w:"hat",p:"👒",lv:2,r:"we wear on our head"},

  {w:"Grandma",p:"👵",lv:3,a:"Grandma"},{w:"Grandpa",p:"👴",lv:3,a:"Grandpa"},{w:"elephant",p:"🐘",lv:3,a:"an elephant",r:"has a long trunk"},
  {w:"lion",p:"🦁",lv:3},{w:"monkey",p:"🐵",lv:3},{w:"giraffe",p:"🦒",lv:3,r:"has a very long neck"},{w:"zebra",p:"🦓",lv:3,r:"has black and white stripes",x:["tiger"]},
  {w:"tiger",p:"🐯",lv:3,x:["zebra"]},{w:"turtle",p:"🐢",lv:3,r:"carries its house on its back"},{w:"penguin",p:"🐧",lv:3},
  {w:"owl",p:"🦉",lv:3,a:"an owl"},{w:"whale",p:"🐋",lv:3},{w:"dolphin",p:"🐬",lv:3},{w:"airplane",p:"✈️",lv:3,a:"an airplane",r:"flies people far away"},
  {w:"bicycle",p:"🚲",lv:3,r:"we ride with pedals"},{w:"grass",p:"🌿",lv:3,a:"some grass"},{w:"snow",p:"❄️",lv:3,a:"some snow",r:"is cold and falls in winter",x:["ice cream"]},
  {w:"rose",p:"🌹",lv:3,a:"a rose",x:["flower"]},{w:"chocolate",p:"🍫",lv:3,a:"some chocolate"},{w:"eggplant",p:"🍆",lv:3,a:"an eggplant"}
];
var PLAN = { 1:{choices:2}, 2:{choices:3}, 3:{choices:4} };

var soundOn=true, actx=null, lvl=BabyKit.level(), mode="look", order=[], idx=-1, target=null, kind="where", busy=false;
function ctx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function chime(){ if(!soundOn) return; try{ var c=ctx(); [660,880,1047].forEach(function(f,i){ var o=c.createOscillator(),g=c.createGain(); o.connect(g); g.connect(c.destination);
  o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,c.currentTime+i*.1); g.gain.exponentialRampToValueAtTime(.25,c.currentTime+i*.1+.02);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.1+.3); o.start(c.currentTime+i*.1); o.stop(c.currentTime+i*.1+.35); }); }catch(e){} }
function say(t,cb){ if(!soundOn){ if(cb) setTimeout(cb,400); return; } BabyVoice.say(t,cb); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pool(){ return WORDS.filter(function(x){ return x.lv<=lvl; }); }
function art(x){ if(x.a) return x.a; return (/^[aeiou]/i.test(x.w)?'an ':'a ')+x.w; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
// Say the word on its own first, then in a short phrase: the word is heard
// twice, and the second time it is never the very first sound (which some
// phones clip).
function sayWord(x){ say(cap(x.w)+'! '+(x.a===x.w ? '' : cap(art(x))+'.')); }

var game=document.getElementById('game'), title=document.getElementById('title');

/* ── Look & say ─────────────────────────────────────────────────────────── */
function look(){
  mode="look"; game.classList.remove('play'); busy=false;
  title.textContent = lvl===1 ? 'Tap the picture! 👆' : 'Tap the picture to hear it again 👂';
  order=shuffle(pool()); idx=-1; next();
}
function show(){
  var x=order[idx];
  BabyPhotos.fill(document.getElementById('pic'), x.w, x.p, {alt:x.w});
  document.getElementById('word').textContent=x.w;
  document.getElementById('letter').textContent = lvl===3 ? x.w.charAt(0).toUpperCase()+' '+x.w.charAt(0).toLowerCase() : '';
  var card=document.getElementById('card'); card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  if(lvl===3) say(cap(x.w)+'! '+cap(art(x))+'. '+x.w.charAt(0).toUpperCase()+' is for '+x.w+'.');
  else sayWord(x);
}
function next(){ idx++; if(idx>=order.length){ order=shuffle(pool()); idx=0; } show(); }
document.getElementById('card').addEventListener('click', function(){ if(idx<0) return next(); chime(); sayWord(order[idx]); });
document.getElementById('next').addEventListener('click', function(){ chime(); confetti(8); next(); });

/* ── Find it! ───────────────────────────────────────────────────────────── */
function ask(){
  if(kind==='riddle'){ title.textContent='Which one '+target.r+'? 🤔'; say('Which one '+target.r+'?'); }
  else { title.textContent='Where is '+(target.a===target.w?'':'the ')+target.w+'? 👀'; say('Where is '+(target.a===target.w?'':'the ')+target.w+'?'); }
}
function round(){
  mode="play"; game.classList.add('play'); busy=false;
  var p=shuffle(pool()), n=PLAN[lvl].choices;
  target=p[0];
  kind = (lvl===3 && target.r && Math.random()<.5) ? 'riddle' : 'where';
  var bad = (target.x||[]).concat([target.w]);
  var picks=[target];
  for(var i=1;i<p.length && picks.length<n;i++){
    var c=p[i]; if(bad.indexOf(c.w)>=0) continue;
    if(kind==='riddle' && c.r && c.r===target.r) continue;
    if(c.x && c.x.indexOf(target.w)>=0) continue;
    picks.push(c);
  }
  picks=shuffle(picks);
  var box=document.getElementById('choices'); box.innerHTML='';
  // sizes that always fit the screen: 2 big, 3 in a row, or 2 by 2
  box.style.setProperty('--cols', n===3?3:2);
  box.style.setProperty('--size', n===2 ? 'min(42vw,34vh)' : n===3 ? 'min(28vw,30vh)' : 'min(40vw,27vh)');
  picks.forEach(function(c){
    var d=document.createElement('div'); d.className='ch'; d.innerHTML='<div></div>';
    BabyPhotos.fill(d.firstChild, c.w, c.p, {alt:c.w});
    d.addEventListener('click', function(){ choose(c,d); });
    box.appendChild(d);
  });
  ask();
}
function choose(c,d){
  if(busy) return;
  var box=document.getElementById('choices');
  if(c===target){
    busy=true; d.classList.add('right'); chime(); confetti(14);
    Array.prototype.forEach.call(box.children,function(e){ if(e!==d) e.classList.add('dim'); });
    title.textContent='Yes! '+cap(art(c))+'! 🎉';
    var moved=false; function nx(){ if(moved) return; moved=true; if(mode==='play') round(); }
    say('Yes! '+cap(art(c))+'! Well done!', function(){ setTimeout(nx,700); });
    setTimeout(nx,6000);
  } else {
    d.classList.remove('wiggle'); void d.offsetWidth; d.classList.add('wiggle');
    // a gentle "no" that still teaches: name what they touched
    say('That is '+art(c)+'. '+(kind==='riddle' ? 'Which one '+target.r+'?' : 'Where is '+(target.a===target.w?'':'the ')+target.w+'?'));
  }
}

function confetti(n){ var ce="🎉🎈⭐🌟✨".split('');
  for(var i=0;i<n;i++){ var el=document.createElement('div'); el.className='confetti'; el.textContent=ce[Math.floor(Math.random()*ce.length)];
    el.style.left=(Math.random()*100)+'vw'; el.style.top='-8vh'; el.style.animationDelay=(Math.random()*.3)+'s'; game.appendChild(el);
    el.addEventListener('animationend', function(){ this.remove(); }); } }
function setMode(m){
  document.getElementById('mLook').classList.toggle('on', m==='look');
  document.getElementById('mPlay').classList.toggle('on', m==='play');
  if(m==='look') look(); else round();
}
document.getElementById('mLook').addEventListener('click', function(){ setMode('look'); });
document.getElementById('mPlay').addEventListener('click', function(){ setMode('play'); });
document.addEventListener('babylevel', function(e){ lvl=e.detail; setMode(mode); });
function toggleSound(){ soundOn=!soundOn; if(!soundOn){ try{speechSynthesis.cancel();}catch(e){} } }
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });
// first picture appears straight away; its word is said on the first tap
// (phones only allow speech after a tap)
order=shuffle(pool()); idx=0;
(function first(){ var x=order[0]; BabyPhotos.fill(document.getElementById('pic'), x.w, x.p, {alt:x.w}); document.getElementById('word').textContent=x.w;
  document.getElementById('letter').textContent = lvl===3 ? x.w.charAt(0).toUpperCase()+' '+x.w.charAt(0).toLowerCase() : ''; })();
</script>
</body>
</html>
