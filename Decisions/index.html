<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pending Decisions</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --muted:#5b6675; --best:#0a7f5a; --warn:#b26a00; --bad:#9a2a2a; --line:#e3e7ec; --link:#3a5a8c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--ink); padding:16px; }
  main { max-width:900px; margin:auto; }
  h1 { font-size:24px; margin:4px 0; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:18px; }
  .filters { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filters button { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:7px 14px; font-size:14px; cursor:pointer; }
  .filters button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-left:6px solid var(--best); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  a.card:hover { box-shadow:0 2px 10px rgba(0,0,0,.08); }
  a.card.soon { border-left-color:var(--warn); }
  a.card.overdue { border-left-color:var(--bad); }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .title { font-size:18px; font-weight:700; }
  .due { font-weight:700; font-size:14px; white-space:nowrap; }
  .due.ok { color:var(--best); } .due.soon { color:var(--warn); } .due.overdue { color:var(--bad); }
  .meta { color:var(--muted); font-size:13px; margin:4px 0 8px; }
  .pick { display:inline-block; background:#e7f5ef; color:var(--best); font-weight:700; font-size:13px; padding:3px 10px; border-radius:999px; margin-bottom:6px; }
  ul { margin:6px 0 0; padding-left:18px; font-size:14px; } li { margin:2px 0; }
  .open { color:var(--link); font-size:14px; font-weight:600; margin-top:8px; }
  .empty { background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:24px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Pending decisions</h1>
  <div class="sub">Sorted by deadline, most urgent first. Open one to see the options side by side and finalize it.</div>
  <div class="filters"><button data-f="all" class="on">All</button><button data-f="home">Home</button><button data-f="work">Work</button></div>
  <div id="list"></div>
</main>
<script src="decisions.js"></script>
<script>
(function(){
  var DAY=86400000;
  function parse(d){ var p=d.split('-'); return new Date(+p[0], +p[1]-1, +p[2], 23, 59); }
  function fmt(d){ return d.toLocaleDateString('en-CA',{weekday:'short', month:'short', day:'numeric', year:'numeric'}); }
  function status(dl){
    var ms=dl-new Date(), days=Math.ceil(Math.abs(ms)/DAY);
    if(ms<0) return {cls:'overdue', text:'Overdue by '+days+' day'+(days===1?'':'s')};
    if(days<=7) return {cls:'soon', text:(days<=1?'Due today':'Due in '+days+' days')};
    return {cls:'ok', text:'Due in '+days+' days'};
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var filter='all';
  function render(){
    var items=(window.DECISIONS||[]).filter(function(d){return filter==='all'||d.who===filter;})
      .map(function(d){ d._dl=parse(d.deadline); return d; })
      .sort(function(a,b){ return a._dl-b._dl; });
    var el=document.getElementById('list');
    if(!items.length){ el.innerHTML='<div class="empty">Nothing pending. 🎉</div>'; return; }
    el.innerHTML=items.map(function(d){
      var s=status(d._dl);
      return '<a class="card '+s.cls+'" href="'+esc(d.url)+'">'+
        '<div class="row"><span class="title">'+esc(d.title)+'</span><span class="due '+s.cls+'">'+s.text+'</span></div>'+
        '<div class="meta">Deadline '+fmt(d._dl)+' &middot; '+esc(d.deadlineWhy)+' &middot; '+(d.who==='work'?'Work':'Home')+', decided by '+esc(d.decideBy)+'</div>'+
        '<span class="pick">Best pick: '+esc(d.bestPick)+'</span>'+
        '<ul>'+d.critical.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>'+
        '<div class="open">Open and decide &rarr;</div></a>';
    }).join('');
  }
  document.querySelectorAll('.filters button').forEach(function(b){
    b.addEventListener('click',function(){ document.querySelectorAll('.filters button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); filter=b.getAttribute('data-f'); render(); });
  });
  render();
})();
</script>
</body>
</html>
